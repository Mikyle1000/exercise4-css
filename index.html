<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
    <style>
      body {
        background-image: url("download.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 100vh;
      }

      .carousel-sm img {
        max-height: 280px;
        object-fit: cover;
      }
    </style>
    <title>The Shop</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html">The Shop</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="products.html">Products</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div class="text-center mb-4">
        <h1 class="display-5 animate__animated animate__tada mb-3">
          Welcome to The Shop
        </h1>
        <a
          href="products.html"
          class="btn btn-success animate__animated animate__heartBeat"
          >Shop Now</a
        >
      </div>

      <section class="row justify-content-center mb-4">
        <div class="col-12 col-md-9 col-lg-7">
          <div
            id="shopCarousel"
            class="carousel slide carousel-sm shadow rounded overflow-hidden"
            data-bs-ride="carousel"
          >
            <div class="carousel-indicators">
              <button
                type="button"
                data-bs-target="#shopCarousel"
                data-bs-slide-to="0"
                class="active"
                aria-current="true"
                aria-label="Slide 1"
              ></button>
              <button
                type="button"
                data-bs-target="#shopCarousel"
                data-bs-slide-to="1"
                aria-label="Slide 2"
              ></button>
              <button
                type="button"
                data-bs-target="#shopCarousel"
                data-bs-slide-to="2"
                aria-label="Slide 3"
              ></button>
            </div>

            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  src="https://via.placeholder.com/900x280?text=Featured+Item+1"
                  class="d-block w-100"
                  alt="Featured item 1"
                />
              </div>
              <div class="carousel-item">
                <img
                  src="https://via.placeholder.com/900x280?text=Featured+Item+2"
                  class="d-block w-100"
                  alt="Featured item 2"
                />
              </div>
              <div class="carousel-item">
                <img
                  src="https://via.placeholder.com/900x280?text=Featured+Item+3"
                  class="d-block w-100"
                  alt="Featured item 3"
                />
              </div>
            </div>

            <button
              class="carousel-control-prev"
              type="button"
              data-bs-target="#shopCarousel"
              data-bs-slide="prev"
            >
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Previous</span>
            </button>
            <button
              class="carousel-control-next"
              type="button"
              data-bs-target="#shopCarousel"
              data-bs-slide="next"
            >
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Next</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-primary text-white py-3 mt-auto">
      <div
        class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2"
      >
        <p class="mb-0">&copy; 2026 The Shop. All rights reserved.</p>
        <div class="d-flex gap-3">
          <a href="index.html" class="text-white text-decoration-none">Home</a>
          <a href="products.html" class="text-white text-decoration-none"
            >Products</a
          >
          <a href="contact.html" class="text-white text-decoration-none"
            >Contact</a
          >
          <a href="about.html" class="text-white text-decoration-none">About</a>
        </div>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
